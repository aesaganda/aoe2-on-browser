<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Age of Empires II: The Conquerors, recompiled to run in the browser.">
<link rel="icon" href="favicon.ico">
<title>Age of Empires II: The Conquerors (recompiled)</title>
<style>
  :root { color-scheme: dark; --bg: #111; --fg: #ddd; --dim: #888; --accent: #c9a24a; --err: #e45; --ok: #5b5; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  #setup { max-width: 640px; margin: 8vh auto; padding: 0 16px; }
  h1 { font-size: 20px; color: var(--accent); margin: 0 0 8px; }
  p { color: var(--dim); }
  button { font: inherit; padding: 8px 14px; margin: 4px 8px 4px 0; background: #2a2a2a; color: var(--fg); border: 1px solid #444; border-radius: 4px; cursor: pointer; transition: border-color 0.15s; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button[hidden] { display: none; }
  h2 { font-size: 16px; color: var(--accent); margin: 24px 0 4px; }
  input { font: inherit; padding: 6px 8px; background: #1b1b1b; color: var(--fg); border: 1px solid #444; border-radius: 4px; }
  .room { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #2a2a2a; }
  .room span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; color: var(--dim); max-height: 30vh; overflow: auto; margin-top: 12px; }
  progress { width: 100%; accent-color: var(--accent); }
  #canvas { display: block; margin: 0 auto; background: #000; outline: none; max-width: 100vw; max-height: 100vh; }
  #screen { position: fixed; pointer-events: none; image-rendering: pixelated; }
  canvas[hidden] { display: none !important; }
  #status { font-size: 12px; padding: 2px 8px; border-radius: 3px; display: inline-block; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--bg); color: var(--dim); font: 16px system-ui, sans-serif; z-index: 10; }
  #loading progress { width: 200px; }
  .warn { background: #332200; border: 1px solid #664400; border-radius: 4px; padding: 8px 12px; margin: 8px 0; color: #ffcc66; font-size: 13px; }
  @media (max-width: 600px) {
    #setup { margin: 4vh auto; }
    h1 { font-size: 17px; }
    .room { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="setup">
  <h1>Age of Empires II: The Conquerors — browser build</h1>
  <noscript><p style="color:var(--err)">This page needs JavaScript to run the game.</p></noscript>
  <div id="compat-warn" hidden class="warn"></div>
  <p id="intro">Pick your installed copy of <strong>The Conquerors 1.0</strong> below — it is copied once into this
    browser (about 0.5 GB) and stays on this computer. After that, every visit goes straight to the game.</p>
  <p id="eula-row"><label><input type="checkbox" id="eula"> I accept the game's End User License Agreement
    (<code>eulax.rtf</code> in your install), as its own setup asks.</label></p>
  <div id="actions">
    <button id="pick">Choose your install folder…</button>
    <button id="server" hidden>Copy from this server</button>
    <button id="play" hidden>Play alone</button>
    <button id="forget" hidden>Remove the copy</button>
  </div>
  <section id="online" hidden>
    <h2>Online <span id="status"></span></h2>
    <p><label>Your name <input id="player" maxlength="15" placeholder="Player" autocomplete="off"></label></p>
    <p><input id="roomname" maxlength="30" placeholder="Game name" autocomplete="off"> <button id="host">Host a game</button></p>
    <div id="rooms" role="list">…</div>
  </section>
  <progress id="bar" max="1" value="0" hidden></progress>
  <div id="log" role="log" aria-live="polite"></div>
</div>
<div id="loading" hidden>
  <div>Loading the game…</div>
  <progress id="load-bar" max="1" value="0"></progress>
</div>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()" hidden></canvas>
<canvas id="screen" hidden></canvas>
<script src="page.js"></script>
</body>
</html>
