<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age of Empires II: The Conquerors (recompiled)</title>
<style>
  :root { color-scheme: dark; --bg: #111; --fg: #ddd; --dim: #888; --accent: #c9a24a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  #setup { max-width: 640px; margin: 8vh auto; padding: 0 16px; }
  h1 { font-size: 20px; color: var(--accent); margin: 0 0 8px; }
  p { color: var(--dim); }
  button { font: inherit; padding: 8px 14px; margin: 4px 8px 4px 0; background: #2a2a2a; color: var(--fg); border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[hidden] { display: none; }
  #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; color: var(--dim); max-height: 30vh; overflow: auto; }
  progress { width: 100%; }
  #canvas { display: block; margin: 0 auto; background: #000; outline: none; max-width: 100vw; max-height: 100vh; }
  /* the game's frames (Module.ra2Present), over SDL's canvas; the mouse goes through to it */
  #screen { position: fixed; pointer-events: none; image-rendering: pixelated; }
  canvas[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="setup">
  <h1>Age of Empires II: The Conquerors — browser build</h1>
  <p id="intro">This page runs a static recompilation of the game. It needs your own installed copy: it is copied once
    into this site's private browser storage (about 0.5 GB), and stays on this computer.</p>
  <p><label><input type="checkbox" id="eula"> I accept the game's End User License Agreement
    (<code>eulax.rtf</code> in your install), as its own setup asks.</label></p>
  <div id="actions">
    <button id="pick">Choose your install folder…</button>
    <button id="server" hidden>Copy from this server</button>
    <button id="play" hidden>Play</button>
    <button id="forget" hidden>Remove the copy</button>
  </div>
  <progress id="bar" max="1" value="0" hidden></progress>
  <div id="log"></div>
</div>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()" hidden></canvas>
<canvas id="screen" hidden></canvas>
<script src="page.js"></script>
</body>
</html>
