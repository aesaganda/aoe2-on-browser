<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Age of Empires II: The Conquerors, recompiled to run directly in the browser.">
<meta name="theme-color" content="#c9a24a">
<meta property="og:title" content="Age of Empires II — browser build">
<meta property="og:description" content="Age of Empires II: The Conquerors 1.0, recompiled to WebAssembly. Play directly in your browser.">
<meta property="og:type" content="website">
<meta property="og:image" content="icon-512.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Age of Empires II: The Conquerors (recompiled)</title>
<style>
  :root { color-scheme: dark; --bg: #111; --fg: #ddd; --dim: #888; --accent: #c9a24a; --err: #e45; --ok: #5b5; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  #setup { position: fixed; inset: 0; z-index: 25; background: rgba(17, 17, 17, 0.92); overflow: auto; padding: 6vh 16px; }
  #setup[hidden] { display: none; }
  #setup-panel { max-width: 640px; margin: 0 auto; background: #181818; border: 1px solid #333; border-radius: 8px; padding: 20px 24px; }
  h1 { font-size: 20px; color: var(--accent); margin: 0 0 12px; }
  p { color: var(--dim); }
  button { font: inherit; padding: 8px 14px; margin: 4px 8px 4px 0; background: #2a2a2a; color: var(--fg); border: 1px solid #444; border-radius: 4px; cursor: pointer; transition: border-color 0.15s; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button[hidden] { display: none; }
  h2 { font-size: 16px; color: var(--accent); margin: 24px 0 4px; }
  input { font: inherit; padding: 6px 8px; background: #1b1b1b; color: var(--fg); border: 1px solid #444; border-radius: 4px; }
  .room { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #2a2a2a; }
  .room span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; color: var(--dim); max-height: 30vh; overflow: auto; margin-top: 12px; }
  progress { width: 100%; accent-color: var(--accent); }
  #canvas { display: block; margin: 0 auto; background: #000; outline: none; max-width: 100vw; max-height: 100vh; touch-action: none; }
  #screen { position: fixed; pointer-events: none; image-rendering: pixelated; }
  canvas[hidden] { display: none !important; }
  #status { font-size: 12px; padding: 2px 8px; border-radius: 3px; display: inline-block; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .dimmed { opacity: 0.5; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--bg); color: var(--fg); font: 16px system-ui, sans-serif; z-index: 10; padding: 16px; text-align: center; }
  #loading[hidden] { display: none; }
  #loading progress { width: 260px; max-width: 80vw; }
  #load-sub { font-size: 12px; color: var(--dim); min-height: 1.4em; }
  .warn { background: #332200; border: 1px solid #664400; border-radius: 4px; padding: 8px 12px; margin: 8px 0; color: #ffcc66; font-size: 13px; max-width: 520px; }
  #game-ui { position: fixed; top: 8px; right: 8px; z-index: 20; display: flex; align-items: center; gap: 6px; }
  #game-ui button { margin: 0; padding: 4px 10px; font-size: 13px; line-height: 20px; background: rgba(0,0,0,0.55); border-color: rgba(255,255,255,0.15); opacity: 0.45; transition: opacity 0.2s; }
  #game-ui #fullscreen-btn { font-size: 16px; }
  #game-ui button:hover { opacity: 1; border-color: var(--accent); }
  #game-ui[hidden] { display: none; }
  footer { margin-top: 32px; padding-top: 12px; border-top: 1px solid #2a2a2a; font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  #help-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 30; display: flex; align-items: center; justify-content: center; }
  #help-overlay[hidden] { display: none; }
  #help-box { background: #1b1b1b; border: 1px solid #444; border-radius: 8px; padding: 20px 28px; max-width: 400px; width: 90%; }
  #help-box h3 { color: var(--accent); margin: 0 0 12px; font-size: 16px; }
  #help-box dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; }
  #help-box dt { color: var(--fg); font: 13px ui-monospace, monospace; }
  #help-box dd { margin: 0; color: var(--dim); font-size: 13px; }
  @media (max-width: 600px) {
    #setup { padding: 3vh 12px; }
    #setup-panel { padding: 16px; }
    h1 { font-size: 17px; }
    .room { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="setup" hidden>
  <div id="setup-panel">
    <h1>Age of Empires II: The Conquerors</h1>
    <div id="actions">
      <button id="play">Play</button>
      <button id="saves-btn" hidden>Saves</button>
      <button id="import-rec" hidden title="Import a recorded game (.mgx)">Import recording</button>
      <input type="file" id="rec-input" accept=".mgx,.mgl,.mgz" hidden>
      <span id="save-count" style="font-size:12px;color:var(--dim);margin-left:4px"></span>
    </div>
    <div id="saves-list" hidden style="margin:8px 0;max-height:200px;overflow:auto"></div>
    <section id="online">
      <h2>Online <span id="status"></span></h2>
      <p><label>Your name <input id="player" maxlength="15" placeholder="Player" autocomplete="off"></label></p>
      <p><input id="roomname" maxlength="30" placeholder="Game name" autocomplete="off"> <button id="host">Host a game</button></p>
      <div id="rooms" role="list">…</div>
    </section>
    <div id="log" role="log" aria-live="polite"></div>
    <footer>
      <span><span id="version"></span> <span id="storage-info" style="margin-left:8px"></span></span>
      <span><a href="#" id="clear-cache" style="color:var(--err);margin-right:12px">Clear cache</a><a href="#" id="help-link">Keyboard shortcuts</a></span>
    </footer>
  </div>
</div>
<div id="loading">
  <noscript><p style="color:var(--err)">This page needs JavaScript to run the game.</p></noscript>
  <div id="compat-warn" hidden class="warn"></div>
  <div id="load-text">Loading the game…</div>
  <progress id="load-bar" max="1" value="0"></progress>
  <div id="load-sub"></div>
  <button id="retry-btn" hidden>Retry</button>
</div>
<div id="game-ui" hidden>
  <span id="game-timer" style="font:11px ui-monospace,monospace;color:rgba(255,255,255,0.35);padding:2px 6px;user-select:none"></span>
  <span id="fps" style="font:11px ui-monospace,monospace;color:rgba(255,255,255,0.35);padding:2px 6px;user-select:none"></span>
  <span id="ping" style="font:11px ui-monospace,monospace;color:rgba(255,255,255,0.35);padding:2px 6px;user-select:none"></span>
  <button id="mute-btn" title="Mute / unmute (M)">🔊</button>
  <button id="online-btn" title="Online rooms">Online</button>
  <button id="fullscreen-btn" title="Fullscreen (F11)">⛶</button>
</div>
<div id="help-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="help-title">
  <div id="help-box">
    <h3 id="help-title">Keyboard shortcuts</h3>
    <dl>
      <dt>F11</dt><dd>Toggle fullscreen</dd>
      <dt>M</dt><dd>Mute / unmute</dd>
      <dt>Esc</dt><dd>Exit fullscreen / close overlay</dd>
    </dl>
    <p style="margin:12px 0 0;font-size:12px;color:var(--dim)">All standard Age of Empires II hotkeys work in-game.</p>
    <button id="help-close" style="margin-top:12px">Close</button>
  </div>
</div>
<canvas id="canvas" tabindex="0" hidden></canvas>
<canvas id="screen" hidden></canvas>
<script src="page.js"></script>
</body>
</html>
