# Host Nginx Reverse Proxy template for Age of Empires II: The Conquerors (Browser Edition)
# Install on the host at /etc/nginx/sites-available/aoe2.conf (symlink to sites-enabled/)
# Replace `aoe2.example.com` and certificate paths with your real domain & Certbot paths.

map $http_upgrade $aoe2_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream aoe2_docker_gateway {
    server 127.0.0.1:8642;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name aoe2.example.com;

    # ACME challenge pass-through for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aoe2.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/aoe2.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aoe2.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AoE2SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Add HSTS only at the TLS termination layer (gateway provides COOP/COEP/CORP/CSP)
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # DirectPlay WebSocket relay
    location = /relay {
        proxy_pass http://aoe2_docker_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aoe2_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Unbuffered streaming for initial ~585 MB game asset bundle
    location = /install/bundle.tar {
        proxy_pass http://aoe2_docker_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://aoe2_docker_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
