map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $uri $aoe2_cache_control {
    ~^/install/bundle/              "public, max-age=31536000, immutable";
    ~*\.(wasm|data)$                "public, max-age=31536000, immutable";
    ~*\.(png|svg|ico|webmanifest)$  "public, max-age=86400";
    default                         "no-cache";
}

limit_req_zone $binary_remote_addr zone=aoe2_chat:10m rate=1r/s;

upstream aoe2_web {
    server web:8642;
    keepalive 16;
}

upstream aoe2_relay {
    server relay:8643;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Trust private Docker / loopback reverse proxies to preserve real client IP
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml application/manifest+json;

    # Strip upstream copies so server-level security headers are never duplicated
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'" always;
    add_header Cache-Control $aoe2_cache_control always;

    location = /health {
        access_log off;
        proxy_pass http://aoe2_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /health/deep {
        access_log off;
        proxy_pass http://aoe2_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # DirectPlay multiplayer WebSocket endpoint
    location = /relay {
        proxy_pass http://aoe2_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Rate-limited lobby chat endpoint
    location = /relay/chat {
        limit_req zone=aoe2_chat burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://aoe2_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
    }

    # Multiplayer rooms / stats JSON API
    location ^~ /relay/ {
        proxy_pass http://aoe2_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
    }

    # Streaming game install bundle (585+ MB tar stream — disable buffering)
    location = /install/bundle.tar {
        proxy_pass http://aoe2_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Relay-Proxy "1";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The bundle in 32 MiB chunks under a versioned URL, so Cloudflare caches them
    location ^~ /install/bundle/ {
        proxy_pass http://aoe2_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Relay-Proxy "1";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /install/ {
        proxy_pass http://aoe2_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Relay-Proxy "1";
    }

    location ^~ /api/ {
        proxy_pass http://aoe2_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Relay-Proxy "1";
    }

    # Serve compiled WebAssembly assets directly with gzip_static on (precompressed aoe2.wasm.gz)
    location ~ ^/(aoe2\.wasm|aoe2\.js|aoe2\.json)$ {
        root /srv/aoe2/build;
        try_files $uri @web_fallback;
    }

    location = /favicon.ico {
        root /srv/aoe2/web;
        try_files /favicon.ico @web_fallback;
    }

    location / {
        root /srv/aoe2/web;
        index index.html;
        try_files $uri $uri/ @web_fallback;
    }

    location @web_fallback {
        proxy_pass http://aoe2_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Relay-Proxy "1";
    }
}
