name: ci
on: [push, pull_request]

jobs:
  test:
    # CI never has the game binary (ADR-0002): it runs pcrecomp's self-test and the
    # synthetic-PE differential tests; the AoE2 prototype tests skip themselves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential mingw-w64 python3-venv
      - name: Python venv
        run: |
          python3 -m venv "$HOME/.local/share/aoe2-recomp/venv"
          "$HOME/.local/share/aoe2-recomp/venv/bin/pip" install -r tools/requirements.txt
      - name: make test
        run: make test

  web-and-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install web and relay dependencies
        run: python -m pip install -r deploy/requirements.txt
      - name: Syntax check and run web/relay/bundle tests
        run: |
          python -m py_compile tools/web/serve.py tools/net/relay.py tools/bundle.py tests/test_web_and_relay.py tests/test_bundle.py
          python -m unittest -v tests/test_web_and_relay.py tests/test_bundle.py
          bash -n play.sh && ./play.sh --help >/dev/null
      - name: Validate Docker Compose config and Docker image build
        run: |
          docker compose --env-file .env.example config --quiet
          docker build -t aoe2-recomp-web:ci .
