name: images
# Publishes the two images ./play.sh uses, to ghcr.io/<owner>/:
#   aoe2-recomp-builder  toolchain (Ghidra, emsdk, lifter deps), linux/amd64
#   aoe2-recomp-web      web server + multiplayer relay, amd64/arm64/arm/v7
# Neither holds game files or anything derived from them (ADR-0002): the builder is
# tested here only on the synthetic fixtures. Pull requests build and test, no push.
on:
  push:
    branches: [main]
    paths:
      - docker/builder/**
      - tools/requirements.txt
      - Dockerfile
      - deploy/requirements.txt
      - tools/web/serve.py
      - tools/net/relay.py
      - web/**
      - .github/workflows/images.yml
  pull_request:
    paths:
      - docker/builder/**
      - tools/requirements.txt
      - Dockerfile
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space (the toolchain image is a few GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aoe2-recomp-builder" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/builder/Dockerfile
          platforms: linux/amd64
          load: true
          tags: aoe2-recomp-builder:ci
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max
      - name: Test the toolchain inside it (pcrecomp self-test + synthetic PE; no game binary)
        run: |
          docker run --rm -v "$PWD:/src" aoe2-recomp-builder:ci bash -c \
            'emcc --version | head -1 && java -version 2>&1 | head -1 && ls -d $AOE2R_TOOLS/ghidra_*_PUBLIC && make test'
      - name: Check play.sh
        run: |
          bash -n play.sh
          ./play.sh --help
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/builder/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=builder

  web:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aoe2-recomp-web" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: AOE2_VERSION=${{ steps.name.outputs.short }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ steps.name.outputs.short }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
